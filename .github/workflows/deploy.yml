name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno a desplegar
        type: choice
        required: true
        options:
          - test
          - prod

env:
  BACKEND_JAR: detodobackend-0.0.1-SNAPSHOT.jar

jobs:
  deploy-test:
    if: inputs.environment == 'test'
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    concurrency:
      group: deploy-test
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Backend/dtodo-backend/pom.xml

      - name: Build backend (perfil test)
        working-directory: Backend/dtodo-backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -Ptest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install dependencias frontend
        working-directory: Frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend (configuracion test)
        working-directory: Frontend
        run: pnpm run build:test

      - name: Configurar acceso SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Verificar que existe el keystore SSL (lo mantiene el hook de certbot)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            if [ ! -s /var/apps/dtodo/ssl/dtodo.p12 ]; then
              echo "::error::Falta /var/apps/dtodo/ssl/dtodo.p12. Instalar el hook como root (ver deploy/certbot/README.md) antes de desplegar."
              exit 1
            fi
          '

      - name: Subir jar del backend
        run: |
          scp -o StrictHostKeyChecking=no \
            Backend/dtodo-backend/target/${{ env.BACKEND_JAR }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/apps/dtodo/api/backend/dev/${{ env.BACKEND_JAR }}.new

      - name: Reemplazar jar, reiniciar y verificar (test; revierte si no levanta)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' -- \
            /var/apps/dtodo/api/backend/dev ${{ env.BACKEND_JAR }} dtodo-dev-api.service \
            ${{ vars.TEST_API_PORT || '8383' }} /var/apps/dtodo/api/backend/dev/logs/spring.log \
            < .github/scripts/desplegar-backend.sh

      - name: Publicar estaticos del frontend (test)
        run: |
          rsync -avz --no-owner --no-group --no-perms --omit-dir-times --delete --exclude='.htaccess' \
            -e "ssh -o StrictHostKeyChecking=no" \
            Frontend/dist/frontend/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/dtodojalapa/domains/dev.dtodojalapa.xyz/public_html/

  deploy-prod:
    if: inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15
    concurrency:
      group: deploy-prod
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Backend/dtodo-backend/pom.xml

      - name: Build backend (perfil prod)
        working-directory: Backend/dtodo-backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -Pprod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install dependencias frontend
        working-directory: Frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend (configuracion production)
        working-directory: Frontend
        run: pnpm run build:prod

      - name: Configurar acceso SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Verificar que existe el keystore SSL (lo mantiene el hook de certbot)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            if [ ! -s /var/apps/dtodo/ssl/dtodo.p12 ]; then
              echo "::error::Falta /var/apps/dtodo/ssl/dtodo.p12. Instalar el hook como root (ver deploy/certbot/README.md) antes de desplegar."
              exit 1
            fi
          '

      - name: Subir jar del backend
        run: |
          scp -o StrictHostKeyChecking=no \
            Backend/dtodo-backend/target/${{ env.BACKEND_JAR }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/apps/dtodo/api/backend/${{ env.BACKEND_JAR }}.new

      - name: Reemplazar jar, reiniciar y verificar (prod; revierte si no levanta)
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' -- \
            /var/apps/dtodo/api/backend ${{ env.BACKEND_JAR }} dtodo-api.service \
            ${{ vars.PROD_API_PORT || '8382' }} /var/apps/dtodo/api/backend/logs/spring.log \
            < .github/scripts/desplegar-backend.sh

      - name: Publicar estaticos del frontend (prod)
        run: |
          rsync -avz --no-owner --no-group --no-perms --omit-dir-times --delete --exclude='.htaccess' \
            -e "ssh -o StrictHostKeyChecking=no" \
            Frontend/dist/frontend/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/dtodojalapa/public_html/
