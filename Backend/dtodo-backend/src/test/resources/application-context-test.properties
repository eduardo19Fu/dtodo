# Context smoke tests must never connect to an environment database.
spring.datasource.url=jdbc:h2:mem:dtodo-context;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# H2 arranca vacío: no hay tablas contra las que validar el mapeo.
dtodo.schema-check.enabled=false

server.ssl.enabled=false
logging.file.name=
debug=false
