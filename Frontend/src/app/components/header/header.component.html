<header class="app-header">
  <div class="header-leading">
    <button type="button" class="header-icon-button menu-toggle" (click)="toggleSidebar.emit()"
      [attr.aria-label]="sidebarCollapsed ? 'Expandir menú lateral' : 'Alternar menú lateral'"
      [attr.title]="sidebarCollapsed ? 'Expandir menú' : 'Minimizar menú'">
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>

    <span class="header-divider" aria-hidden="true"></span>

    <a [routerLink]="['/home']" class="home-link">
      <span class="home-icon" aria-hidden="true"><i class="fas fa-home"></i></span>
      <span>
        <small>Panel principal</small>
        <strong>Inicio</strong>
      </span>
    </a>
  </div>

  <div class="header-actions">
    <span class="system-status"><i class="fas fa-circle" aria-hidden="true"></i> Sistema activo</span>
    <button type="button" class="header-icon-button" (click)="alternarPantallaCompleta()"
      [attr.aria-label]="pantallaCompleta ? 'Salir de pantalla completa' : 'Activar pantalla completa'"
      [attr.title]="pantallaCompleta ? 'Salir de pantalla completa' : 'Pantalla completa'">
      <i class="fas" [ngClass]="pantallaCompleta ? 'fa-compress-arrows-alt' : 'fa-expand-arrows-alt'"
        aria-hidden="true"></i>
    </button>
  </div>
</header>
