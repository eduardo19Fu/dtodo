<div *ngIf="clienteCreateService.modal" class="abrir-modal animacion fadeIn">
  <div class="modal quick-client-modal" tabindex="-1" role="dialog" aria-modal="true"
    aria-labelledby="quick-client-title">
    <div class="modal-dialog modal-lg quick-client-dialog">
      <div class="modal-content quick-client-content">
        <div class="modal-header quick-client-header">
          <div class="quick-client-heading">
            <span class="quick-client-heading-icon" aria-hidden="true"><i class="fas fa-user-plus"></i></span>
            <div>
              <span>Cliente no encontrado</span>
              <h5 class="modal-title" id="quick-client-title">{{title}}</h5>
            </div>
          </div>
          <button (click)="cerrarModal()" type="button" class="quick-client-close" aria-label="Cerrar modal">
            <i class="fas fa-times" aria-hidden="true"></i>
          </button>
        </div>

        <form #clienteForm="ngForm" class="quick-client-form">
          <div class="modal-body quick-client-body">
            <div class="quick-client-intro">
              <span class="quick-client-info-icon" aria-hidden="true"><i class="fas fa-info-circle"></i></span>
              <div>
                <strong>Completa los datos del nuevo cliente</strong>
                <p>El NIT consultado quedará asociado automáticamente al documento actual.</p>
              </div>
              <span class="quick-client-nit"><i class="fas fa-fingerprint"></i> NIT {{cliente.nit}}</span>
            </div>

            <div class="quick-client-grid">
              <div class="field-group name-field">
                <label for="modal-cliente-nombre">Nombre <span class="required-mark">*</span></label>
                <div class="control-with-icon">
                  <i class="fas fa-user" aria-hidden="true"></i>
                  <input type="text" id="modal-cliente-nombre" class="form-control" name="nombre"
                    [(ngModel)]="cliente.nombre" required placeholder="Nombre completo o razón social"
                    #nombre="ngModel">
                </div>
                <div class="validation-message" *ngIf="nombre.invalid && (nombre.touched || nombre.dirty)">
                  <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                  El nombre no puede estar vacío.
                </div>
              </div>

              <div class="field-group nit-field">
                <label for="modal-cliente-nit">NIT</label>
                <div class="control-with-icon readonly-control">
                  <i class="fas fa-fingerprint" aria-hidden="true"></i>
                  <input type="text" id="modal-cliente-nit" name="nit" class="form-control"
                    [(ngModel)]="cliente.nit" required readonly #nit="ngModel">
                  <span class="locked-indicator" title="NIT consultado"><i class="fas fa-lock"></i></span>
                </div>
              </div>

              <div class="field-group address-field">
                <label for="modal-cliente-direccion">Dirección <span class="required-mark">*</span></label>
                <div class="control-with-icon">
                  <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
                  <input type="text" id="modal-cliente-direccion" name="direccion" class="form-control"
                    [(ngModel)]="cliente.direccion" placeholder="Dirección completa del cliente" required
                    #direccion="ngModel">
                </div>
                <div class="validation-message"
                  *ngIf="direccion.invalid && (direccion.dirty || direccion.touched)">
                  <i class="fas fa-exclamation-circle" aria-hidden="true"></i>
                  La dirección no puede estar vacía.
                </div>
              </div>

              <div class="field-group phone-field">
                <label for="modal-cliente-telefono">Teléfono</label>
                <div class="control-with-icon">
                  <i class="fas fa-phone-alt" aria-hidden="true"></i>
                  <input type="text" id="modal-cliente-telefono" name="telefono" class="form-control"
                    [(ngModel)]="cliente.telefono" placeholder="Ej. 5555-5555">
                </div>
                <small>Opcional</small>
              </div>
            </div>
          </div>

          <div class="modal-footer quick-client-footer">
            <p><i class="fas fa-shield-alt" aria-hidden="true"></i> Los datos se guardarán en el directorio de clientes.</p>
            <div class="quick-client-actions">
              <button (click)="cerrarModal()" type="button" class="quick-client-cancel">Cancelar</button>
              <button type="submit" class="quick-client-confirm" (click)="create()"
                [disabled]="!clienteForm.form.valid">
                <i class="fas fa-save" aria-hidden="true"></i> Guardar cliente
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
