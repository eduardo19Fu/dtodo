<section class="ftco-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center mb-5">
                <h2 class="heading-section">{{headerTitle}}</h2>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-12 col-lg-10">
                <div class="wrap d-md-flex">
                    <div class="img" style="background-image: url(assets/img/logo-dtodo.jpg);">
                    </div>
                    <div class="login-wrap p-4 p-md-5">
                        <div class="d-flex">
                            <div class="w-100">
                                <h3 class="mb-4 text-center">{{title}}</h3>
                            </div>
                        </div>
                        <form id="formulario-ingreso" method="POST" class="signin-form">
                            <div class="form-group mb-3">
                                <label class="label" for="usuario">{{usuarioTitle}}</label>
                                <input [(ngModel)]="usuario.usuario" type="text" name="username" class="form-control"
                                    placeholder="Username" required autofocus>
                            </div>
                            <div class="form-group mb-3">
                                <label class="label" for="password">{{passwordTitle}}</label>
                                <div class="input-group">
                                    <input [(ngModel)]="usuario.password"
                                        [type]="passwordVisible ? 'text' : 'password'"
                                        name="password" class="form-control"
                                        placeholder="Password" autocomplete="current-password" required>
                                    <div class="input-group-append">
                                        <button type="button" class="btn btn-outline-secondary toggle-password"
                                            (click)="togglePasswordVisible()"
                                            [attr.aria-label]="passwordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                                            <i class="fas" [ngClass]="passwordVisible ? 'fa-eye-slash' : 'fa-eye'"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <button (click)="login()" type="submit" class="form-control btn btn-primary rounded submit px-3">Entrar</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
