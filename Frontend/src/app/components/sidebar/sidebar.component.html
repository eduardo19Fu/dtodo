<aside class="app-sidebar" [class.is-collapsed]="collapsed">
  <a [routerLink]="['/home']" class="brand" (click)="notificarNavegacion()" title="Ir al inicio">
    <span class="brand-logo"><img src="assets/img/logo-dtodo-d.jpg" alt="Logo de D'Todo"></span>
    <span class="brand-copy">
      <strong>D'Todo</strong>
      <small>Gestión comercial</small>
    </span>
  </a>

  <div class="sidebar-scroll">
    <section class="user-card" [attr.title]="collapsed ? usuario?.primerNombre + ' ' + usuario?.apellido : null">
      <span class="user-avatar"><img src="assets/img/icons8-user-64.png" alt=""></span>
      <div class="user-copy">
        <span>Sesión activa</span>
        <strong>{{ usuario?.primerNombre }} {{ usuario?.apellido }}</strong>
        <small *ngIf="usuario?.sucursal"><i class="fas fa-store" aria-hidden="true"></i>{{ usuario.sucursal.nombre }}</small>
      </div>
    </section>

    <div class="sidebar-search">
      <i class="fas fa-search" aria-hidden="true"></i>
      <input type="search" [(ngModel)]="filtro" placeholder="Buscar módulo" aria-label="Buscar en el menú">
      <button *ngIf="filtro" type="button" (click)="limpiarBusqueda()" aria-label="Limpiar búsqueda">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </div>

    <nav class="sidebar-navigation" aria-label="Navegación principal">
      <span class="navigation-label">Menú principal</span>

      <section class="menu-group" *ngIf="mostrarGrupo('productos')"
        [class.is-open]="menuAbierto('productos')" [class.is-active]="router.url.startsWith('/productos') && !router.url.includes('/inventario')">
        <button type="button" class="menu-link group-trigger" (click)="alternarMenu('productos')"
          [attr.aria-expanded]="menuAbierto('productos')" title="Productos">
          <span class="menu-icon"><i class="fas fa-boxes" aria-hidden="true"></i></span>
          <span class="menu-label">Productos</span>
          <i class="fas fa-chevron-down menu-chevron" aria-hidden="true"></i>
        </button>
        <div class="submenu" *ngIf="menuAbierto('productos')">
          <a *ngIf="coincide('listado', 'productos') && (authService.hasRole('ROLE_INVENTARIO') || authService.hasRole('ROLE_ADMIN') || authService.hasRole('ROLE_COBRADOR'))"
            [routerLink]="['/productos/index']" class="submenu-link" routerLinkActive="active"
            (click)="notificarNavegacion()"><span></span>Listado</a>
          <a *ngIf="coincide('marcas', 'productos') && (authService.hasRole('ROLE_INVENTARIO') || authService.hasRole('ROLE_ADMIN'))"
            [routerLink]="['/productos/marcas/index']" class="submenu-link" [class.active]="router.url.includes('/marcas/')"
            (click)="notificarNavegacion()"><span></span>Marcas</a>
          <a *ngIf="coincide('categorías', 'categorias', 'productos') && (authService.hasRole('ROLE_INVENTARIO') || authService.hasRole('ROLE_ADMIN'))"
            [routerLink]="['/productos/categorias/index']" class="submenu-link" [class.active]="router.url.includes('/categorias/')"
            (click)="notificarNavegacion()"><span></span>Categorías</a>
        </div>
      </section>

      <a *ngIf="coincide('movimientos de producto', 'inventario') && (authService.hasRole('ROLE_ADMIN') || authService.hasRole('ROLE_INVENTARIO'))"
        [routerLink]="['/productos/inventario/index']" class="menu-link" routerLinkActive="active"
        (click)="notificarNavegacion()" title="Movimientos de producto">
        <span class="menu-icon"><i class="fas fa-exchange-alt" aria-hidden="true"></i></span>
        <span class="menu-label">Movimientos de producto</span>
      </a>

      <a *ngIf="coincide('proformas') && (authService.hasRole('ROLE_COBRADOR') || authService.hasRole('ROLE_ADMIN') || authService.hasRole('ROLE_INVENTARIO'))"
        [routerLink]="['/proformas/index']" class="menu-link" [class.active]="router.url.startsWith('/proformas')"
        (click)="notificarNavegacion()" title="Proformas">
        <span class="menu-icon"><i class="fas fa-file-alt" aria-hidden="true"></i></span>
        <span class="menu-label">Proformas</span>
      </a>

      <section class="menu-group" *ngIf="mostrarGrupo('facturas') && (authService.hasRole('ROLE_COBRADOR') || authService.hasRole('ROLE_ADMIN'))"
        [class.is-open]="menuAbierto('facturas')" [class.is-active]="router.url.startsWith('/facturas')">
        <button type="button" class="menu-link group-trigger" (click)="alternarMenu('facturas')"
          [attr.aria-expanded]="menuAbierto('facturas')" title="Facturas">
          <span class="menu-icon"><i class="fas fa-file-invoice-dollar" aria-hidden="true"></i></span>
          <span class="menu-label">Facturas</span>
          <i class="fas fa-chevron-down menu-chevron" aria-hidden="true"></i>
        </button>
        <div class="submenu" *ngIf="menuAbierto('facturas')">
          <a *ngIf="coincide('facturas', 'facturas emitidas')" [routerLink]="['/facturas/index']"
            class="submenu-link" routerLinkActive="active" (click)="notificarNavegacion()"><span></span>Facturas emitidas</a>
          <a *ngIf="coincide('correlativos', 'facturas') && authService.hasRole('ROLE_ADMIN')"
            [routerLink]="['/facturas/correlativos/index']" class="submenu-link" routerLinkActive="active"
            (click)="notificarNavegacion()"><span></span>Correlativos</a>
        </div>
      </section>

      <a *ngIf="coincide('notas de crédito', 'notas de credito') && (authService.hasRole('ROLE_ADMIN') || authService.hasRole('ROLE_COBRADOR') || authService.hasRole('ROLE_INVENTARIO'))"
        [routerLink]="['/notas-credito/index']" class="menu-link" [class.active]="router.url.startsWith('/notas-credito')"
        (click)="notificarNavegacion()" title="Notas de crédito">
        <span class="menu-icon"><i class="fas fa-credit-card" aria-hidden="true"></i></span>
        <span class="menu-label">Notas de crédito</span>
      </a>

      <a *ngIf="coincide('clientes') && (authService.hasRole('ROLE_COBRADOR') || authService.hasRole('ROLE_ADMIN'))"
        [routerLink]="['/clientes/index']" class="menu-link" [class.active]="router.url.startsWith('/clientes')"
        (click)="notificarNavegacion()" title="Clientes">
        <span class="menu-icon"><i class="fas fa-user-friends" aria-hidden="true"></i></span>
        <span class="menu-label">Clientes</span>
      </a>

      <a *ngIf="coincide('sucursales') && authService.hasRole('ROLE_ADMIN')" [routerLink]="['/sucursales/index']"
        class="menu-link" [class.active]="router.url.startsWith('/sucursales')" (click)="notificarNavegacion()" title="Sucursales">
        <span class="menu-icon"><i class="fas fa-store" aria-hidden="true"></i></span>
        <span class="menu-label">Sucursales</span>
      </a>

      <a *ngIf="coincide('usuarios') && authService.hasRole('ROLE_ADMIN')" [routerLink]="['/usuarios/index']"
        class="menu-link" [class.active]="router.url.startsWith('/usuarios')" (click)="notificarNavegacion()" title="Usuarios">
        <span class="menu-icon"><i class="fas fa-users" aria-hidden="true"></i></span>
        <span class="menu-label">Usuarios</span>
      </a>
    </nav>
  </div>

  <button type="button" class="logout-button" (click)="cerrarSesion()" title="Cerrar sesión">
    <span class="menu-icon"><i class="fas fa-sign-out-alt" aria-hidden="true"></i></span>
    <span class="menu-label">Cerrar sesión</span>
  </button>
</aside>
