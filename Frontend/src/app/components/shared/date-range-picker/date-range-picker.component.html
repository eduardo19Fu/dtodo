<div class="date-range-theme" [ngClass]="'date-range-theme-' + tema">
  <div class="col-lg-4 col-md-6 mb-3 mb-lg-0 date-picker-column">
    <label [id]="idComponente + '-inicio-label'" class="filter-label">Fecha de inicio</label>
    <button type="button" class="date-trigger" [id]="idComponente + '-inicio-trigger'"
      [class.date-trigger-active]="calendarioAbierto && selectorFechaActivo === 'inicio'"
      [attr.aria-expanded]="calendarioAbierto && selectorFechaActivo === 'inicio'"
      [attr.aria-labelledby]="idComponente + '-inicio-label'" aria-haspopup="dialog"
      (click)="abrirCalendario('inicio')">
      <span class="date-trigger-icon"><i class="far fa-calendar-alt" aria-hidden="true"></i></span>
      <span class="date-trigger-copy">
        <small>Desde</small>
        <strong [class.date-placeholder]="!fechaInicio">{{formatearFechaVisible(fechaInicio)}}</strong>
      </span>
      <i class="fas fa-chevron-down date-trigger-chevron" aria-hidden="true"></i>
    </button>
    <ng-container *ngIf="calendarioAbierto && selectorFechaActivo === 'inicio'"
      [ngTemplateOutlet]="calendarioTemplate"></ng-container>
  </div>

  <div class="col-lg-4 col-md-6 mb-3 mb-lg-0 date-picker-column date-picker-column-end">
    <label [id]="idComponente + '-fin-label'" class="filter-label">Fecha de fin</label>
    <button type="button" class="date-trigger" [id]="idComponente + '-fin-trigger'"
      [class.date-trigger-active]="calendarioAbierto && selectorFechaActivo === 'fin'"
      [attr.aria-expanded]="calendarioAbierto && selectorFechaActivo === 'fin'"
      [attr.aria-labelledby]="idComponente + '-fin-label'" aria-haspopup="dialog"
      (click)="abrirCalendario('fin')">
      <span class="date-trigger-icon"><i class="far fa-calendar-check" aria-hidden="true"></i></span>
      <span class="date-trigger-copy">
        <small>Hasta</small>
        <strong [class.date-placeholder]="!fechaFin">{{formatearFechaVisible(fechaFin)}}</strong>
      </span>
      <i class="fas fa-chevron-down date-trigger-chevron" aria-hidden="true"></i>
    </button>
    <ng-container *ngIf="calendarioAbierto && selectorFechaActivo === 'fin'"
      [ngTemplateOutlet]="calendarioTemplate"></ng-container>
  </div>

  <ng-template #calendarioTemplate>
    <button type="button" class="calendar-mobile-backdrop" (click)="cerrarCalendario()"
      aria-label="Cerrar calendario"></button>
    <section class="custom-calendar-panel animacion fadeIn" [class.calendar-panel-above]="calendarioArriba"
      [id]="idComponente + '-calendar'" [ngStyle]="estilosCalendario" role="dialog" aria-modal="false"
      aria-label="Selector de rango de fechas">
      <div class="calendar-main">
        <header class="calendar-header">
          <div>
            <span class="calendar-eyebrow">Seleccionando {{selectorFechaActivo === 'inicio' ? 'inicio' : 'fin'}}</span>
            <strong>{{tituloMesVisible}}</strong>
          </div>
          <div class="calendar-navigation">
            <button type="button" (click)="cambiarMes(-1)" aria-label="Mes anterior">
              <i class="fas fa-chevron-left" aria-hidden="true"></i>
            </button>
            <button type="button" class="today-navigation" (click)="mostrarMesActual()">Hoy</button>
            <button type="button" (click)="cambiarMes(1)" aria-label="Mes siguiente">
              <i class="fas fa-chevron-right" aria-hidden="true"></i>
            </button>
          </div>
        </header>

        <div class="calendar-weekdays" aria-hidden="true">
          <span *ngFor="let diaSemana of diasSemana">{{diaSemana}}</span>
        </div>
        <div class="calendar-days">
          <button type="button" *ngFor="let dia of diasCalendario" class="calendar-day"
            [class.calendar-day-outside]="!dia.mesActual" [class.calendar-day-today]="dia.esHoy"
            [class.calendar-day-range]="estaEnRango(dia.iso)" [class.calendar-day-start]="dia.iso === fechaInicio"
            [class.calendar-day-end]="dia.iso === fechaFin" [attr.aria-label]="dia.etiqueta"
            [attr.aria-pressed]="dia.iso === fechaInicio || dia.iso === fechaFin" (click)="seleccionarFecha(dia)">
            {{dia.numero}}
          </button>
        </div>
      </div>

      <aside class="calendar-sidebar">
        <div class="range-preview">
          <span class="range-preview-icon"><i class="fas fa-calendar-week" aria-hidden="true"></i></span>
          <div>
            <small>Rango seleccionado</small>
            <strong>{{resumenRango}}</strong>
          </div>
        </div>
        <span class="shortcuts-label">Accesos rápidos</span>
        <button type="button" class="range-shortcut" (click)="seleccionarRangoRapido(1)">Hoy</button>
        <button type="button" class="range-shortcut" (click)="seleccionarRangoRapido(7)">Últimos 7 días</button>
        <button type="button" class="range-shortcut" (click)="seleccionarRangoRapido(30)">Últimos 30 días</button>
        <button type="button" class="range-shortcut" (click)="seleccionarMesActual()">Este mes</button>
        <div class="calendar-sidebar-actions">
          <button type="button" class="calendar-clear" (click)="limpiarSeleccion()">
            <i class="far fa-trash-alt" aria-hidden="true"></i> Limpiar
          </button>
          <button type="button" class="calendar-done" (click)="cerrarCalendario()">Listo</button>
        </div>
      </aside>
    </section>
  </ng-template>
</div>
