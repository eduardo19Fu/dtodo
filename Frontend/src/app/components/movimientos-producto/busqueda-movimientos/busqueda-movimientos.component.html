<div class="report-modal-overlay" [class.report-modal-closing]="cerrando" (click)="cerrarModal()">
  <div class="inventory-report-modal" tabindex="-1" role="dialog" aria-modal="true"
    aria-labelledby="inventory-report-title" (click)="$event.stopPropagation()">
    <div class="report-modal-dialog inventory-report-content">
      <header class="inventory-report-header">
        <div class="report-heading-icon" aria-hidden="true">
          <i class="fas fa-file-alt"></i>
        </div>
        <div class="report-heading-copy">
          <span>Reportes</span>
          <h4 class="report-title" id="inventory-report-title">{{ title }}</h4>
          <p>Selecciona el período que deseas consultar.</p>
        </div>
        <button type="button" class="report-close" (click)="cerrarModal()" aria-label="Cerrar">
          <i class="fas fa-times" aria-hidden="true"></i>
        </button>
      </header>

      <form #formBusqueda="ngForm" id="form-busqueda" (ngSubmit)="onSubmit()">
        <div class="inventory-report-body">
          <div class="report-intro">
            <span class="report-intro-icon" aria-hidden="true"><i class="far fa-calendar-alt"></i></span>
            <div>
              <strong>Define el rango de fechas</strong>
              <p>El reporte incluirá todos los movimientos de inventario registrados durante este período.</p>
            </div>
          </div>

          <div class="report-field sucursal-field" *ngIf="auth.hasRole('ROLE_ADMIN')">
            <label for="reporte-sucursal">Sucursal</label>
            <div class="select-control">
              <i class="fas fa-store" aria-hidden="true"></i>
              <select id="reporte-sucursal" name="reporte-sucursal" class="form-control" [(ngModel)]="idSucursal">
                <option *ngFor="let sucursal of sucursales" [ngValue]="sucursal.idSucursal">{{ sucursal.nombre }}</option>
              </select>
            </div>
          </div>

          <div class="report-date-grid">
            <div class="report-field">
              <label for="fecha-inicio">Fecha inicial <span aria-hidden="true">*</span></label>
              <div class="date-control">
                <i class="far fa-calendar" aria-hidden="true"></i>
                <input type="date" class="form-control" name="fecha-inicio" id="fecha-inicio"
                  [(ngModel)]="fechaIni" required aria-required="true">
              </div>
            </div>

            <div class="report-field">
              <label for="fecha-fin">Fecha final <span aria-hidden="true">*</span></label>
              <div class="date-control">
                <i class="far fa-calendar-check" aria-hidden="true"></i>
                <input type="date" class="form-control" name="fecha-fin" id="fecha-fin"
                  [(ngModel)]="fechaFin" required aria-required="true">
              </div>
            </div>
          </div>
        </div>

        <footer class="inventory-report-footer">
          <span class="required-note"><i class="fas fa-info-circle" aria-hidden="true"></i> Ambos campos son obligatorios</span>
          <div class="report-actions">
            <button type="button" class="report-cancel" (click)="cerrarModal()">Cancelar</button>
            <button type="submit" class="report-submit" [disabled]="!formBusqueda.form.valid">
              <i class="fas fa-file-pdf" aria-hidden="true"></i>
              Generar reporte
            </button>
          </div>
        </footer>
      </form>
    </div>
  </div>
</div>
