<router-outlet *ngIf="esRutaPublica"></router-outlet>

<div *ngIf="!esRutaPublica" class="app-shell"
  [class.sidebar-collapsed]="sidebarColapsado"
  [class.sidebar-mobile-open]="sidebarMovilAbierto">

  <div *ngIf="preloaderVisible" class="app-preloader" [class.app-preloader-leaving]="preloaderCerrando"
    aria-label="Cargando aplicación" role="status">
    <img class="preloader-logo" src="assets/img/Aglaya-logo2.png" alt="Aglaya">
  </div>

  <app-sidebar [collapsed]="sidebarColapsado"
    (expandir)="expandirSidebar()" (navegacion)="cerrarSidebarMovil()">
  </app-sidebar>

  <button *ngIf="sidebarMovilAbierto" type="button" class="sidebar-backdrop"
    (click)="cerrarSidebarMovil()" aria-label="Cerrar menú de navegación"></button>

  <div class="shell-workspace">
    <app-header [sidebarCollapsed]="sidebarColapsado" (toggleSidebar)="alternarSidebar()"></app-header>

    <main class="shell-content" id="contenido-principal">
      <router-outlet></router-outlet>
    </main>

    <footer class="shell-footer">
      <span>D'Todo · Gestión comercial</span>
      <span class="footer-status"><i class="fas fa-shield-alt" aria-hidden="true"></i> Sesión segura</span>
    </footer>
  </div>
</div>
